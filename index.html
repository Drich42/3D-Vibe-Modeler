<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Preference Sorter</title>
    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
    <!-- Load MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #eee;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .image-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .image-pair {
            max-width: 45%;
        }
        img {
            max-width: 100%;
            max-height: 500px;
            border: 4px solid #444;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        img:hover {
            transform: scale(1.02);
        }
        .selected {
            border-color: #4ade80;
            box-shadow: 0 0 30px #4ade80;
        }
        .results {
            margin-top: 40px;
        }
        .ranked-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .rank-item {
            text-align: center;
        }
        .rank-item img {
            max-height: 180px;
            border: 3px solid #666;
        }
        .progress {
            font-size: 18px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h1>🖼️ Image Preference Sorter</h1>
    <p>Pick your favorite between two images. We'll sort them by your taste.</p>

    <div class="controls">
        <button onclick="toggleFullscreen()" id="fullscreenBtn">⛶ Fullscreen</button>
        <input type="file" id="dirInput" webkitdirectory directory multiple accept="image/*" style="display: none;">
        <button onclick="document.getElementById('dirInput').click()">📁 Load Image Folder</button>
        <button onclick="startSorting()" id="startBtn" disabled>🚀 Start Sorting</button>
        <button onclick="showResults()" id="resultsBtn" disabled>📊 Show Results</button>
        <button onclick="saveSession()" id="saveBtn" disabled>💾 Save Session</button>
        <button onclick="loadSession()" id="loadBtn">📂 Load Session</button>
    </div>

    <div id="status" class="progress"></div>

    <div class="image-container" id="pairContainer" style="display: none;">
        <div class="image-pair">
            <img id="img1" onclick="choose(0)">
            <p id="label1">Image A</p>
        </div>
        <div class="image-pair">
            <img id="img2" onclick="choose(1)">
            <p id="label2">Image B</p>
        </div>
    </div>

    <div class="controls" id="choiceControls" style="display: none;">
        <button onclick="choose(0)">👍 Prefer Left</button>
        <button onclick="skip()">⏭️ Skip / Tie</button>
        <button onclick="choose(1)">👍 Prefer Right</button>
    </div>

    <div id="resultsPanel" class="results" style="display: none;">
        <h2>Your Ranked Preferences</h2>
        <div id="rankedList" class="ranked-list"></div>
        <div class="controls">
            <button onclick="exportCSV()" id="exportBtn">📄 Export CSV</button>
            <button onclick="resetAll()">Start Over</button>
        </div>
    </div>

    <script>
        let images = [];
        let scores = new Map();
        let embeddings = new Map(); // name -> 1D tensor
        let comparisons = 0;
        let currentPair = [];
        let isTransitioning = false;
        let featureExtractor = null;
        let historyData = []; // Array of {a: name, b: name, winner: 0|1}

        // Siamese Network Components
        let scoringModel = null;
        let trainingModel = null;

        const dirInput = document.getElementById('dirInput');
        const startBtn = document.getElementById('startBtn');
        const resultsBtn = document.getElementById('resultsBtn');
        const saveBtn = document.getElementById('saveBtn');
        const pairContainer = document.getElementById('pairContainer');
        const choiceControls = document.getElementById('choiceControls');
        const statusEl = document.getElementById('status');

        // Setup Siamese Network
        function setupModels() {
            const embeddingDim = 1280; // MobileNet v2 embedding size

            // Define custom Subtract Layer for tfjs (since tf.layers.subtract is not available natively in tfjs)
            class SubtractLayer extends tf.layers.Layer {
                constructor() {
                    super({});
                }
                computeOutputShape(inputShape) {
                    return inputShape[0];
                }
                call(inputs, kwargs) {
                    return tf.sub(inputs[0], inputs[1]);
                }
                static get className() {
                    return 'SubtractLayer';
                }
            }
            tf.serialization.registerClass(SubtractLayer);
            const subtractLayer = () => new SubtractLayer();

            // 1. Scoring Sub-network (Shared weights)
            const inputLayer = tf.input({shape: [embeddingDim]});
            const dense1 = tf.layers.dense({units: 256, activation: 'relu', kernelRegularizer: tf.regularizers.l2({l2: 0.01})}).apply(inputLayer);
            const dropout = tf.layers.dropout({rate: 0.5}).apply(dense1);
            const dense2 = tf.layers.dense({units: 64, activation: 'relu', kernelRegularizer: tf.regularizers.l2({l2: 0.01})}).apply(dropout);
            const scoreOutput = tf.layers.dense({units: 1, activation: 'linear'}).apply(dense2);

            scoringModel = tf.model({inputs: inputLayer, outputs: scoreOutput});

            // 2. Training Network (A vs B)
            const inputA = tf.input({shape: [embeddingDim]});
            const inputB = tf.input({shape: [embeddingDim]});

            const scoreA = scoringModel.apply(inputA);
            const scoreB = scoringModel.apply(inputB);

            // Output is prob(A > B) = sigmoid(scoreA - scoreB)
            const diff = subtractLayer().apply([scoreA, scoreB]);
            const probAWin = tf.layers.activation({activation: 'sigmoid'}).apply(diff);

            trainingModel = tf.model({inputs: [inputA, inputB], outputs: probAWin});
            trainingModel.compile({
                optimizer: tf.train.adam(0.001),
                loss: 'binaryCrossentropy'
            });
        }

        // Load MobileNet immediately
        (async function init() {
            statusEl.textContent = "Loading neural network...";
            try {
                featureExtractor = await mobilenet.load({version: 2, alpha: 1.0});
                setupModels();
                statusEl.textContent = "Neural network ready! Load a folder.";
            } catch (e) {
                console.warn("WebGL initialization failed, falling back to CPU", e);
                statusEl.textContent = "Falling back to CPU backend...";
                await tf.setBackend('cpu');
                featureExtractor = await mobilenet.load({version: 2, alpha: 1.0});
                setupModels();
                statusEl.textContent = "Neural network ready (CPU)! Load a folder.";
            }
        })();

        async function extractEmbedding(imgElement) {
            // MobileNet infers a 1x1000 tensor for classification. We can use infer() for raw 1024 embedding
            const embed = featureExtractor.infer(imgElement, true);
            const squeezed = embed.squeeze(); // 1D tensor
            embed.dispose();
            return squeezed;
        }

        dirInput.addEventListener('change', async (e) => {
            if (!featureExtractor) {
                alert("Model still loading, please wait...");
                return;
            }

            images = [];
            scores.clear();
            embeddings.forEach(t => t.dispose());
            embeddings.clear();

            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));

            // Render hidden images to extract features
            const hiddenContainer = document.createElement('div');
            hiddenContainer.style.display = 'none';
            document.body.appendChild(hiddenContainer);

            for (let i = 0; i < files.length; i++) {
                statusEl.textContent = `Processing image ${i+1}/${files.length}...`;
                const file = files[i];
                const url = URL.createObjectURL(file);

                const img = new Image();
                img.src = url;

                try {
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                    });
                    hiddenContainer.appendChild(img);

                    const embed = await extractEmbedding(img);

                    images.push({ name: file.name, url, file });
                    scores.set(file.name, 0);
                    embeddings.set(file.name, embed);
                } catch (err) {
                    console.warn(`Failed to load or process image: ${file.name}`, err);
                }
                // Yield to GPU to prevent shader timeout
                await tf.nextFrame();
            }

            document.body.removeChild(hiddenContainer);

            statusEl.textContent = `Loaded and extracted features for ${images.length} images. Ready to sort!`;
            startBtn.disabled = images.length < 2;
            saveBtn.disabled = images.length < 2;
        });

        async function trainModel() {
            if (historyData.length < 5) return; // Wait for some data

            const xsA = [];
            const xsB = [];
            const ys = [];

            for (const h of historyData) {
                if (embeddings.has(h.a) && embeddings.has(h.b)) {
                    xsA.push(embeddings.get(h.a));
                    xsB.push(embeddings.get(h.b));
                    ys.push([h.winner === 0 ? 1 : 0]); // 1 if A won, 0 if B won
                }
            }

            if (xsA.length === 0) return; // No valid history for current images

            const tensorA = tf.stack(xsA);
            const tensorB = tf.stack(xsB);
            const tensorY = tf.tensor2d(ys);

            await trainingModel.fit([tensorA, tensorB], tensorY, {
                epochs: 5,
                batchSize: 16,
                shuffle: true,
                verbose: 0
            });

            tensorA.dispose();
            tensorB.dispose();
            tensorY.dispose();
        }

        let predictedScores = new Map();

        async function predictAllScores() {
            // Batch all embeddings into a single tensor
            const names = [];
            const tensors = [];
            for (const img of images) {
                if (embeddings.has(img.name)) {
                    names.push(img.name);
                    tensors.push(embeddings.get(img.name));
                }
            }
            if (tensors.length === 0) return;

            const batch = tf.stack(tensors);
            const scoresTensor = scoringModel.predict(batch);
            const scoreData = await scoresTensor.data(); // async, doesn't block UI

            for (let i = 0; i < names.length; i++) {
                predictedScores.set(names[i], scoreData[i]);
            }

            batch.dispose();
            scoresTensor.dispose();
        }

        async function startSorting() {
            if (images.length < 2) return;
            comparisons = historyData.length;
            pairContainer.style.display = 'flex';
            choiceControls.style.display = 'block';
            document.getElementById('resultsPanel').style.display = 'none';
            resultsBtn.disabled = false;

            // Ensure predictions exist
            if (predictedScores.size === 0 && images.length > 0) {
                await predictAllScores();
            }
            pickRandomPair();
        }

        function pickRandomPair() {
            if (images.length < 2) return;

            let imgA, imgB;

            // Active Learning: Pick A randomly, pick B such that their predicted scores are close
            // This maximizes information gain (uncertainty sampling)
            if (historyData.length > 5) {
                imgA = images[Math.floor(Math.random() * images.length)];
                const scoreA = predictedScores.get(imgA.name) || 0;

                // Find candidates excluding A
                const candidates = images.filter(img => img.name !== imgA.name);

                // Sort candidates by how close their score is to A
                candidates.sort((c1, c2) => {
                    const d1 = Math.abs((predictedScores.get(c1.name) || 0) - scoreA);
                    const d2 = Math.abs((predictedScores.get(c2.name) || 0) - scoreA);
                    return d1 - d2;
                });

                // Pick from the top 10% closest to add a bit of randomness
                const topN = Math.max(1, Math.floor(candidates.length * 0.1));
                imgB = candidates[Math.floor(Math.random() * topN)];
            } else {
                // Pure random for initial bootstrap
                const shuffled = [...images].sort(() => Math.random() - 0.5);
                imgA = shuffled[0];
                imgB = shuffled[1];
            }

            currentPair = [imgA, imgB];

            document.getElementById('img1').src = currentPair[0].url;
            document.getElementById('img2').src = currentPair[1].url;
            document.getElementById('label1').textContent = currentPair[0].name;
            document.getElementById('label2').textContent = currentPair[1].name;

            // Clear previous selection
            document.getElementById('img1').classList.remove('selected');
            document.getElementById('img2').classList.remove('selected');

            statusEl.textContent = `Comparison ${comparisons + 1} • ${images.length} images`;
        }

        function choose(winnerIndex) {
            if (isTransitioning) return;
            isTransitioning = true;

            const winner = currentPair[winnerIndex];
            const loser = currentPair[1 - winnerIndex];

            scores.set(winner.name, (scores.get(winner.name) || 0) + 1);

            // Record history for training
            historyData.push({
                a: currentPair[0].name,
                b: currentPair[1].name,
                winner: winnerIndex
            });

            comparisons++;
            statusEl.textContent = `Comparison ${comparisons} • Training model...`;

            // Simple visual feedback
            document.getElementById(`img${winnerIndex + 1}`).classList.add('selected');

            // Train asynchronously
            trainModel().then(async () => {
                await predictAllScores();
                setTimeout(() => {
                    isTransitioning = false;
                    pickRandomPair();
                }, 200);
            });
        }

        function skip() {
            if (isTransitioning) return;
            pickRandomPair();
        }

        function showResults() {
            pairContainer.style.display = 'none';
            choiceControls.style.display = 'none';

            const sorted = [...images].sort((a, b) => {
                // If model has trained, sort by predicted neural net score
                if (predictedScores.size > 0 && historyData.length > 5) {
                    const pA = predictedScores.get(a.name) || 0;
                    const pB = predictedScores.get(b.name) || 0;
                    return pB - pA;
                } else {
                    // Fallback to raw wins
                    const scoreA = scores.get(a.name) || 0;
                    const scoreB = scores.get(b.name) || 0;
                    return scoreB - scoreA;
                }
            });

            const rankedList = document.getElementById('rankedList');
            rankedList.innerHTML = '';

            sorted.forEach((img, index) => {
                const pred = predictedScores.has(img.name) ? predictedScores.get(img.name).toFixed(3) : 'N/A';
                const div = document.createElement('div');
                div.className = 'rank-item';
                div.innerHTML = `
                    <div style="font-size: 28px; font-weight: bold; color: #4ade80;">#${index + 1}</div>
                    <img src="${img.url}" alt="${img.name}">
                    <p>${img.name}</p>
                    <small>Raw Wins: ${scores.get(img.name) || 0}</small><br>
                    <small>Predicted Score: ${pred}</small>
                `;
                rankedList.appendChild(div);
            });

            document.getElementById('resultsPanel').style.display = 'block';
        }

        function resetAll() {
            images = [];
            scores.clear();
            comparisons = 0;
            historyData = [];
            predictedScores.clear();
            dirInput.value = '';
            pairContainer.style.display = 'none';
            choiceControls.style.display = 'none';
            document.getElementById('resultsPanel').style.display = 'none';
            statusEl.textContent = '';
            startBtn.disabled = true;
            resultsBtn.disabled = true;
            saveBtn.disabled = true;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function saveSession() {
            if (historyData.length === 0) {
                alert("No training history to save yet.");
                return;
            }
            try {
                localStorage.setItem('vibe_sort_history', JSON.stringify(historyData));
                alert("Session saved successfully!");
            } catch (e) {
                alert("Failed to save session. Storage might be full.");
            }
        }

        async function loadSession() {
            const data = localStorage.getItem('vibe_sort_history');
            if (data) {
                historyData = JSON.parse(data);
                comparisons = historyData.length;
                statusEl.textContent = `Loaded session with ${comparisons} comparisons.`;

                // If images are already loaded, we can train immediately
                if (images.length > 0 && trainingModel) {
                    statusEl.textContent = "Retraining model on loaded session...";
                    await trainModel();
                    statusEl.textContent = "Model retrained! Ready to sort.";
                }
            } else {
                alert("No saved session found.");
            }
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Rank,ImageName,RawWins,PredictedScore\n";

            const sorted = [...images].sort((a, b) => {
                if (predictedScores.size > 0 && historyData.length > 5) {
                    return (predictedScores.get(b.name) || 0) - (predictedScores.get(a.name) || 0);
                } else {
                    return (scores.get(b.name) || 0) - (scores.get(a.name) || 0);
                }
            });

            sorted.forEach((img, index) => {
                const wins = scores.get(img.name) || 0;
                const pred = predictedScores.has(img.name) ? predictedScores.get(img.name).toFixed(3) : 'N/A';
                csvContent += `${index + 1},${img.name},${wins},${pred}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "image_preferences.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();

            if (pairContainer.style.display !== 'flex') return;
            if (e.key === 'ArrowLeft') choose(0);
            if (e.key === 'ArrowRight') choose(1);
            if (e.key === ' ' || e.key === 'Enter') skip();
        });
    </script>
</body>
</html>
